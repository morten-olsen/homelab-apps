image:
  repository: docker.io/jellyfin/jellyfin
  tag: latest@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
  pullPolicy: IfNotPresent

subdomain: jellyfin

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  port: 8096
  healthProbe:
    type: tcpSocket
    port: http # Use named port

# Service configuration
service:
  port: 80
  targetPort: 8096
  type: ClusterIP

# OIDC client
oidc:
  enabled: true
  redirectUris:
    - "/sso/OID/redirect/Authentik"

# Volume configuration
volumes:
  - name: config
    mountPath: /config
    persistentVolumeClaim: config
  - name: movies
    mountPath: /media/movies
    persistentVolumeClaim: movies # External PVC (not prefixed)
  - name: tvshows
    mountPath: /media/tv-shows
    persistentVolumeClaim: tvshows # External PVC (not prefixed)
  - name: music
    mountPath: /media/music
    persistentVolumeClaim: music # External PVC (not prefixed)

# Persistent volume claims
persistentVolumeClaims:
  - name: config
    size: 5Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: false
    private: true
