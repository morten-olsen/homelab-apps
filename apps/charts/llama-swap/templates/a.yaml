apiVersion: v1
kind: Service
metadata:
  name: llama-swap
  namespace: prod
spec:
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
  clusterIP: None
  type: ClusterIP

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lmstudio
  namespace: prod
  labels:
    kubernetes.io/service-name: llama-swap
  annotations:
    argocd.argoproj.io/sync-options: Prune=false;ServerSideApply=true
addressType: IPv4
endpoints:
  - addresses:
      - "192.168.10.197"
ports:
  - port: 8090
    protocol: TCP
