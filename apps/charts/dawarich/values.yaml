# Dawarich is a Rails app + Sidekiq worker backed by PostGIS-flavored
# Postgres and Redis, with an in-cluster Photon for reverse-geocoding.
# This chart is custom (not common.all) because it ships five deployments;
# common.* supplies the standalone Redis workload, PVCs, OIDC, VirtualService,
# secrets, and backups so the wiring matches every other app.

subdomain: dawarich

# Web + worker share the same image (different entrypoints).
app:
  image:
    repository: freikin/dawarich
    # Renovate will pin the SHA on first run.
    tag: latest@sha256:207dc86f8baa8fcf5b585f31186bf81b55added9c102a96f308d640e964ea60f
    pullPolicy: IfNotPresent

# Self-contained PostGIS rather than the shared CNPG cluster — Dawarich
# requires the postgis extension and PG18 doesn't have a monolithic
# postgis image (the old cloudnative-pg/postgis repo only publishes up
# to PG15; PG18 uses ImageVolume + postgis-extension which the platform
# PostgresDatabase CRD doesn't surface). Data PVC is backed up via VolSync.
db:
  image:
    repository: postgis/postgis
    tag: 17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
    pullPolicy: IfNotPresent

# Redis holds live Sidekiq queues, not Postgres-backed jobs. Keep its existing
# snapshot arguments and no-PVC topology: snapshots are not durable across pod
# replacement, so avoid restarting this store during configuration-only changes.
redis:
  image:
    repository: redis
    tag: 8.10-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    pullPolicy: IfNotPresent
  name: "{release}-redis"
  commonLabels: true
  selectorLabels:
    app: "{release}-redis"
  containerName: redis
  portName: redis
  port: 6379
  args:
    - redis-server
    - --save
    - "900"
    - "1"
    - --save
    - "300"
    - "10"
    - --appendonly
    - "no"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  livenessProbe:
    tcpSocket:
      port: redis
  readinessProbe:
    exec:
      command: ["redis-cli", "ping"]
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379

# Photon does in-cluster reverse-geocoding so we don't ping the public API
# for every point. The data dir is regenerable from the upstream OSM dump,
# so the PVC is intentionally not backed up.
photon:
  image:
    repository: ghcr.io/rtuszik/photon-docker
    tag: latest@sha256:c5babeb0ac396b485822036cf3c69e54fb6c79d699328a4e042e11bbd6f73f1a
    pullPolicy: IfNotPresent
  # europe (~60GB) covers our use case; switch to `planet` (~90GB) for
  # full coverage or a smaller country code (e.g. `dk`) to shrink the PVC.
  region: europe

# Private DNS A record so internal clients don't hairpin through the public
# gateway.
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# Main service — what virtualService routes to. Selector matches the web
# Deployment via app=dawarich-app.
service:
  port: 80
  type: ClusterIP

virtualService:
  enabled: true
  gateways:
    public: false
    private: true

# Authentik provisions {release}-oidc-credentials with clientId, clientSecret
# and issuer; Dawarich supports env-driven OIDC discovery natively.
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - "/users/auth/openid_connect/callback"

# Generated secrets:
# - secretKeyBase: Rails SECRET_KEY_BASE (64-byte hex)
# - dbPassword: Postgres user password, shared between app/sidekiq/db pods
externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: secret-key-base
        length: 64
        encoding: hex
        allowRepeat: true
        secretKeys:
          - secretKeyBase
      - name: db-password
        length: 32
        allowRepeat: true
        secretKeys:
          - dbPassword

persistentVolumeClaims:
  - name: db-data
    size: 10Gi
    storageClassName: local-path
    backup: true
  - name: storage
    size: 20Gi
    storageClassName: local-path
    backup: true
  - name: public
    size: 1Gi
    storageClassName: local-path
    backup: false
  - name: watched
    size: 5Gi
    storageClassName: local-path
    backup: false
  - name: photon-data
    size: 70Gi
    storageClassName: local-path
    backup: false
