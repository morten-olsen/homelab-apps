image:
  repository: code.olsen.cloud/incubator/editions
  tag: 6dee3a01@sha256:4c1675a39e1849272eb21dc029a49b04851eca0e4d2a07f01130cbfb04072b25
  pullPolicy: Always

subdomain: editions

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

deployment:
  strategy: Recreate
  replicas: 1

container:
  # Measured production-copy startup with both fp32 models: 2841 MiB peak RSS.
  # One model is resident at a time; bounded jobs/pages/HTTP and ONNX sessions
  # keep work inside the limit. Long-term stability remains under observation.
  resources:
    requests: { cpu: 250m, memory: 3Gi }
    limits: { cpu: "2", memory: 4Gi }
  ports:
    - name: http
      port: 3007
      protocol: TCP
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
# Service configuration
service:
  port: 3007
  type: ClusterIP

externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: jwt-secret
        length: 48
        encoding: hex
        allowRepeat: true
        secretKeys:
          - jwt-secret

env:
  # Sampled main heap peaked at 162 MiB; native model memory is outside V8.
  NODE_OPTIONS: "--max-old-space-size=512"
  EDITIONS_PORT: "3007"
  EDITIONS_JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: jwt-secret

volumes:
  - name: data
    mountPath: /data
    persistentVolumeClaim: data

persistentVolumeClaims:
  - name: data
    size: 10Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true
