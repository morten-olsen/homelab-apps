image:
  repository: codeberg.org/forgejo/forgejo
  tag: 17@sha256:fcd19ff4ebc85fb098a67e8e1d0d5a84d07dd6e8a23edcfdfd5b71a6178953be
  pullPolicy: IfNotPresent

subdomain: code

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1
  revisionHistoryLimit: 2
  podAnnotations:
    traffic.sidecar.istio.io/excludeInboundPorts: "22"

# Container configuration - multiple ports
container:
  ports:
    - name: http
      port: 3000
      protocol: TCP
    - name: ssh
      port: 22
      protocol: TCP
  healthProbe:
    type: tcpSocket
    port: http # Use named port
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      # Prometheus recorded 5.9 GiB and several hours above 5 GiB.
      memory: 12Gi

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# OIDC/Authentik configuration
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - "/user/oauth2/Authentik/callback"

# Database configuration
database:
  enabled: true

# Service configuration - multiple services
service:
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
      type: ClusterIP
    - name: ssh
      port: 2206
      targetPort: 22
      protocol: TCP
      type: LoadBalancer
      serviceName: ssh # Will be prefixed with release name: {release}-ssh

# Volume configuration
volumes:
  - name: data
    mountPath: /data
    persistentVolumeClaim: data

# Persistent volume claims
persistentVolumeClaims:
  - name: data
    size: 10Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true
  servicePort: 80 # Route to the http service port

# Environment variables
env:
  USER_UID: "1000"
  USER_GID: "1000"
  FORGEJO__server__SSH_DOMAIN:
    value: "ssh-{subdomain}.{domain}" # Will be templated: ssh-{subdomain}.{domain}
  FORGEJO__server__SSH_PORT: "2206"
  FORGEJO__service__REQUIRE_EXTERNAL_REGISTRATION_PASSWORD: "true"
  FORGEJO__service__ENABLE_PASSWORD_SIGNIN_FORM: "false"
  FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
  FORGEJO__service__DEFAULT_USER_IS_RESTRICTED: "true"
  FORGEJO__service__DEFAULT_USER_VISIBILITY: "private"
  FORGEJO__service__DEFAULT_ORG_VISIBILITY: "private"
  FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
  FORGEJO__other__SHOW_FOOTER_POWERED_BY: "false"
  FORGEJO__other__SHOW_FOOTER_TEMPLATE_LOAD_TIME: "false"
  FORGEJO__other__SHOW_FOOTER_VERSION: "false"
  FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
  FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "true"
  FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
  FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
  FORGEJO__security__INSTALL_LOCK: "true"
  # Allow webhooks to in-cluster services (Woodpecker etc.) — Forgejo's
  # default refuses delivery to RFC1918 IPs as an anti-SSRF measure.
  FORGEJO__webhook__ALLOWED_HOST_LIST: "*.olsen.cloud,private"
  FORGEJO__database__DB_TYPE: postgres
  FORGEJO__database__DB_PORT: "5432"
  FORGEJO__database__NAME:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: database
  FORGEJO__database__HOST:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: host
  FORGEJO__database__USER:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: user
  FORGEJO__database__PASSWD:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: password
  # Actions is off: all CI runs on Woodpecker.
  FORGEJO__actions__ENABLED: "false"

# Actions runner configuration (disabled; kept for reference)
actions:
  enabled: false
  runner:
    image:
      repository: code.forgejo.org/forgejo/runner
      tag: "13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d"
      pullPolicy: IfNotPresent
    curlImage:
      repository: curlimages/curl
      tag: latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    dind:
      image:
        repository: code.forgejo.org/oci/docker
        tag: dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
        pullPolicy: IfNotPresent
    name: default
    replicas: 1
    storage:
      size: 10Gi
    labels:
      - "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest-slim@sha256:1241f498a84062d219e28aea36ed7e6b9fc69d014ef75d7dfee785a5a1b5abca"
      - "ubuntu-slim-latest:docker://gitea/runner-images:ubuntu-latest-slim@sha256:1241f498a84062d219e28aea36ed7e6b9fc69d014ef75d7dfee785a5a1b5abca"
      - "ubuntu-full-latest:docker://gitea/runner-images:ubuntu-latest-full@sha256:e387ebe347230c35e1a7f173a0dcf1947d6726c6c542e9b65b0ffc1c6928a601"
      - "docker-cli:docker://code.forgejo.org/oci/docker:cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d"
      - "node-bookworm:docker://code.forgejo.org/oci/node:20-bookworm"
