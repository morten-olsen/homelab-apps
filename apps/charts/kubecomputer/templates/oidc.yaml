{{- if .Values.oidc.enabled }}
# People log in with kc login: a public client with PKCE and kc's loopback redirect. Authentik
# writes the issuer and key URL to kubecomputer-oidc-credentials, which the server reads.
apiVersion: authentik.homelab.mortenolsen.pro/v1alpha1
kind: AuthentikClient
metadata:
  name: kubecomputer
  namespace: {{ .Values.namespace }}
  labels: {{- include "kubecomputer.labels" . | nindent 4 }}
spec:
  serverRef: {{- toYaml .Values.oidc.serverRef | nindent 4 }}
  name: kubecomputer
  clientId: kubecomputer
  clientType: public
  signingKeyName: {{ .Values.oidc.signingKeyName | quote }}
  subjectMode: user_username
  scopes: [openid, profile, email, offline_access]
  grantTypes: [authorization_code, refresh_token]
  redirectUris:
    - "http://127.0.0.1:8000/callback"
  allowedGroups: {{- toYaml .Values.oidc.allowedGroups | nindent 4 }}
{{- end }}
