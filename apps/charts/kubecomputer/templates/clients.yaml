{{- range .Values.clients }}
---
apiVersion: kubecomputer.olsen.cloud/v1alpha1
kind: ComputerClient
metadata:
  name: {{ .name }}
  labels: {{- include "kubecomputer.labels" $ | nindent 4 }}
  annotations:
    # The CRD arrives in the same sync: skip the dry run, and apply clients in a later wave,
    # once the CRDs (wave 0) are established.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec: {{- omit . "name" | toYaml | nindent 2 }}
{{- end }}
