---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: computerclients.kubecomputer.olsen.cloud
spec:
  group: kubecomputer.olsen.cloud
  names:
    kind: ComputerClient
    listKind: ComputerClientList
    plural: computerclients
    shortNames:
    - ccl
    singular: computerclient
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespaces
      name: Namespaces
      type: string
    - jsonPath: .spec.access
      name: Access
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ComputerClient is a service or person allowed to use kubecomputer's API: its namespaces, what
          it may do there, and how it authenticates. Cluster-scoped, so only cluster admins create one.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComputerClientSpec is who a client is and what it may do
              (docs/design.md, A2).
            properties:
              access:
                description: 'access is what the client may do besides reading computers:
                  manage, exec, both or neither.'
                items:
                  description: ClientAccess is what a client may do in its namespaces
                    besides reading computers.
                  enum:
                  - manage
                  - exec
                  type: string
                type: array
                x-kubernetes-list-type: set
              apiKey:
                description: |-
                  apiKey makes the controller generate a key for the client and write it, with the API's
                  URL, to a Secret. Deleting the Secret rotates the key.
                properties:
                  secretRef:
                    description: |-
                      secretRef is the Secret the key is written to, usually in the namespace of the service
                      that uses it.
                    properties:
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: namespace of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                required:
                - secretRef
                type: object
              namespaces:
                description: |-
                  namespaces are where the client's computers live: namespaces labelled
                  kubecomputer.olsen.cloud/namespace=true. "*" means every one of them.
                items:
                  pattern: ^(\*|[a-z0-9]([-a-z0-9]*[a-z0-9])?)$
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              oidc:
                description: oidc admits people logged in through the identity provider,
                  by user or group.
                properties:
                  groups:
                    default: []
                    description: groups are groups (the token's groups claim) the
                      client admits.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  users:
                    default: []
                    description: users are subjects (the token's sub claim) the client
                      admits.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
                x-kubernetes-validations:
                - message: list at least one user or group
                  rule: size(self.users) + size(self.groups) > 0
              secrets:
                description: |-
                  secrets are the Secrets the client may attach to computers' env through the API: glob
                  patterns over Secret names ("agent-*"), in the client's namespaces. A Secret must also be
                  attachable. Empty means none.
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              volumes:
                description: |-
                  volumes are the volumes the client may mount in computers through the API: glob patterns
                  over volume names ("cache-*"), in the client's namespaces. A volume must also be
                  attachable. Empty means none.
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
            required:
            - namespaces
            type: object
            x-kubernetes-validations:
            - message: a client needs an apiKey, oidc, or both
              rule: has(self.apiKey) || has(self.oidc)
          status:
            description: ComputerClientStatus is what the controller last did for
              a client.
            properties:
              conditions:
                description: 'conditions: Ready once the key is written, or when the
                  client has none.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              keyHash:
                description: |-
                  keyHash is the SHA-256 of the client's current API key, hex-encoded. The server
                  authenticates keys by it and never reads the Secret to do so.
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the controller
                  last acted on.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
