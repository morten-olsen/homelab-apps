image:
  repository: crocodilestick/calibre-web-automated
  tag: latest@sha256:6900d554dcfc164250a4c90208e4277a2385f5c2dbc1bb881c5ccae2b3723d29
  pullPolicy: IfNotPresent

subdomain: calibre-web

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  port: 8083
  healthProbe:
    type: tcpSocket

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: data
    mountPath: /config
    persistentVolumeClaim: data # Will be prefixed with release name
  - name: books
    mountPath: /calibre-library
    persistentVolumeClaim: books # External PVC, used as-is

# Persistent volume claims
persistentVolumeClaims:
  - name: data
    size: 1Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true

# Environment variables
env:
  NETWORK_SHARE_MODE: "true"
  PUID: "1000"
  PGID: "1000"
