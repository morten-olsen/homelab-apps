subdomain: metabase

image:
  repository: index.docker.io/metabase/metabase
  tag: latest@sha256:ca6d63cbedfd0a66a3c0239ac79a9df5f7ef3f2455027ab97e3bb26cbf281999
  pullPolicy: IfNotPresent

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  port: 3000
  healthProbe:
    type: tcpSocket
    port: http # Use named port
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 4Gi

# Service configuration
service:
  port: 80
  type: ClusterIP

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true

# Database configuration
database:
  enabled: true

# Environment variables
env:
  # Leave roughly 1 GiB below the container limit for native/JVM overhead.
  JAVA_TOOL_OPTIONS: "-Xmx3g"
  MB_DB_TYPE: postgres
  MB_DB_DBNAME:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: database
  MB_DB_PORT:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: port
  MB_DB_USER:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: user
  MB_DB_PASS:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: password
  MB_DB_HOST:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: host
