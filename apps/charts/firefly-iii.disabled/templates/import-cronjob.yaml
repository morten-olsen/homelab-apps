{{- if .Values.scheduledImport.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}-import"
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scheduledImport.schedule | quote }}
  timeZone: {{ .Values.globals.timezone | quote }}
  suspend: {{ .Values.scheduledImport.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
          labels:
            {{- include "common.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: scheduled-import
        spec:
          restartPolicy: Never
          containers:
            - name: importer
              image: "{{ .Values.importer.image.repository }}:{{ .Values.importer.image.tag }}"
              imagePullPolicy: {{ .Values.importer.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --retry 30 \
                    --retry-delay 2 \
                    --retry-all-errors \
                    --connect-timeout 5 \
                    --max-time 10 \
                    --header "Authorization: Bearer ${FIREFLY_III_ACCESS_TOKEN}" \
                    "${FIREFLY_III_URL}/api/v1/about" \
                    >/dev/null
                  php -r '
                  $source = $argv[1];
                  $target = $argv[2];
                  $config = json_decode(file_get_contents($source), true, 512, JSON_THROW_ON_ERROR);
                  $timezone = new DateTimeZone(getenv("TZ"));
                  $config["date_not_before"] = (new DateTimeImmutable("today", $timezone))
                      ->modify("-30 days")
                      ->format("Y-m-d");
                  file_put_contents(
                      $target,
                      json_encode($config, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL
                  );
                  chmod($target, 0600);
                  ' {{ .Values.scheduledImport.configPath | quote }} /tmp/import-config.json
                  set +e
                  php artisan importer:import /tmp/import-config.json --no-interaction \
                    >/tmp/import.log 2>&1
                  status=$?
                  set -e
                  php -r '
                  $log = file_get_contents($argv[1]);
                  echo preg_replace_callback(
                      "/(The last 25 chars of the access token are:).*/",
                      static fn (array $matches): string => $matches[1] . " [REDACTED]",
                      $log
                  );
                  ' /tmp/import.log
                  if [ "${status}" -eq 1 ] && php -r '
                  $lines = file($argv[1], FILE_IGNORE_NEW_LINES);
                  $completed = false;
                  $duplicates = 0;
                  foreach ($lines as $line) {
                      if ("Done!" === $line) {
                          $completed = true;
                      }
                      if (
                          str_contains($line, "production.ERROR")
                          && !str_contains($line, "Exit code is GENERAL_ERROR")
                      ) {
                          exit(1);
                      }
                      if (str_starts_with($line, "Import index ") && str_contains($line, "]:")) {
                          if (!str_contains($line, "]: There is already ")) {
                              exit(1);
                          }
                          ++$duplicates;
                      }
                  }
                  exit($completed && $duplicates > 0 ? 0 : 1);
                  ' /tmp/import.log; then
                    echo "Importer completed with duplicate-only results."
                    exit 0
                  fi
                  exit "${status}"
              envFrom:
                - secretRef:
                    name: {{ .Values.scheduledImport.credentialsSecret | quote }}
              env:
                - name: FIREFLY_III_URL
                  value: {{ printf "https://firefly.%s" .Values.globals.domain | quote }}
                - name: IMPORT_DIR_ALLOWLIST
                  value: /tmp
                - name: APP_ENV
                  value: production
                - name: APP_DEBUG
                  value: "false"
                - name: LOG_CHANNEL
                  value: stdout
                - name: LOG_LEVEL
                  value: notice
                - name: TZ
                  value: {{ .Values.globals.timezone | quote }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: configurations
                  mountPath: /var/www/html/storage/configurations
          volumes:
            - name: configurations
              persistentVolumeClaim:
                claimName: "{{ .Release.Name }}-configurations"
{{- end }}
