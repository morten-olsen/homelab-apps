subdomain: mealie

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

image:
  repository: ghcr.io/mealie-recipes/mealie
  tag: v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
  pullPolicy: IfNotPresent

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  port: 9000
  healthProbe:
    type: tcpSocket
    port: http # Use named port

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: data
    mountPath: /app/data
    persistentVolumeClaim: data

# Persistent volume claims
persistentVolumeClaims:
  - name: data
    size: 1Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: false
    private: true
  # Mealie has no CORS support of its own; Envoy answers preflights and adds
  # the headers. API tokens travel as a bearer token, so credentials stay off.
  corsPolicy:
    allowOrigins:
      - regex: "https?://localhost(:[0-9]+)?"
      - regex: "https://([a-z0-9-]+\\.)+{domain}"
    allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowHeaders:
      - authorization
      - content-type
    exposeHeaders:
      - content-disposition
      - content-length
    maxAge: 24h

# OIDC client configuration
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - "/login"
  subjectMode: user_username
  # A dedicated scope avoids the conflicting shared email mappings. Provision
  # its reviewed expression with scripts/reconcile-email-mapping.py first.
  scopes:
    - openid
    - profile
    - mealie-email

# Environment variables
env:
  TZ:
    value: "{timezone}"
  BASE_URL:
    value: "https://{subdomain}.{domain}"
  ALLOW_SIGNUP: "false"
  PUID: "1000"
  PGID: "1000"
  OIDC_AUTH_ENABLED: "true"
  OIDC_REQUIRES_EMAIL_VERIFICATION: "true"
  # The standard profile mapping supplies groups as well as the user's name.
  OIDC_SCOPES_OVERRIDE: "openid profile mealie-email"
  OIDC_SIGNUP_ENABLED: "true"
  OIDC_USER_GROUP: "mealie-users"
  OIDC_ADMIN_GROUP: "admin"
  OIDC_AUTO_REDIRECT: "true"
  OIDC_PROVIDER_NAME: Authentik
  OIDC_REMEMBER_ME: "true"
  OIDC_SIGNING_ALGORITHM: RS256
  OIDC_CLIENT_ID:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: clientId
  OIDC_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: clientSecret
  OIDC_CONFIGURATION_URL: "https://auth.{domain}/application/o/{namespace}-{release}/.well-known/openid-configuration" # TODO: fix!
