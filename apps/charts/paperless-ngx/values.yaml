oidcConfigImage:
  repository: bitnami/kubectl
  tag: latest@sha256:bedd34c910e2a5ce9836813d16444af449d7fe07a29136d59f34e861e8e660c5

image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  tag: latest@sha256:1a08d8dfc2b51a08de09652dd86ad4d0c611c362382f944533ad38b73125fbc4
  pullPolicy: IfNotPresent

subdomain: paperless

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1
  revisionHistoryLimit: 0

# Container configuration
container:
  port: 8000
  healthProbe:
    type: httpGet
    path: /api/
    port: http

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: data
    mountPath: /usr/src/paperless/data
    persistentVolumeClaim: data
  - name: media
    mountPath: /usr/src/paperless/media
    persistentVolumeClaim: paperless-ngx-media
  - name: consume
    mountPath: /usr/src/paperless/consume
    persistentVolumeClaim: paperless-ngx-consume
  - name: export
    mountPath: /usr/src/paperless/export
    persistentVolumeClaim: paperless-ngx-export

# Persistent volume claims
persistentVolumeClaims:
  - name: data
    size: 10Gi
    storageClassName: local-path
  - name: media
    size: 50Gi
    storageClassName: local-path
  - name: consume
    size: 5Gi
    storageClassName: local-path
  - name: export
    size: 5Gi
    storageClassName: local-path

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true

# OIDC client configuration
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - "/accounts/oidc/authentik/login/callback/"
  subjectMode: user_username

# Database configuration
database:
  enabled: true

# External Secrets configuration
externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: secretkey
        length: 64
        encoding: hex
        allowRepeat: true
        secretKeys:
          - secretkey

# Environment variables
env:
  TZ:
    value: "{timezone}"
  PAPERLESS_URL:
    value: "https://{subdomain}.{domain}"
  PAPERLESS_SECRET_KEY:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: secretkey
  # Database configuration
  PAPERLESS_DBENGINE: postgresql
  PAPERLESS_DBHOST:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: host
  PAPERLESS_DBPORT:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: port
  PAPERLESS_DBNAME:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: database
  PAPERLESS_DBUSER:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: user
  PAPERLESS_DBPASS:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: password
  # Redis/Valkey configuration
  PAPERLESS_REDIS:
    value: "redis://{release}-valkey.{namespace}.svc.cluster.local:6379"
  # OIDC configuration using django-allauth
  PAPERLESS_ENABLE_ALLAUTH: "true"
  PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
  # PAPERLESS_SOCIALACCOUNT_PROVIDERS is set via init container (see deployment.yaml)
  PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
  PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  # OIDC credentials for init container (will be used to construct JSON)
  PAPERLESS_OIDC_CLIENT_ID:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: clientId
  PAPERLESS_OIDC_CLIENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: clientSecret
  PAPERLESS_OIDC_ISSUER_URL:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: issuer

# Valkey is the Celery broker. Persistence is disabled (no snapshots, no AOF,
# no PVC), so a pod replacement drops queued tasks; files left in consume/ are
# picked up again on the next scan.
valkey:
  image:
    repository: valkey/valkey
    tag: latest@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    pullPolicy: IfNotPresent
  name: "{release}-valkey"
  commonLabels: true
  selectorLabels:
    app: "{release}-valkey"
  containerName: "{release}-valkey"
  portName: tcp
  port: 6379
  args:
    - valkey-server
    - --appendonly
    - "no"
    - --save
    - ""
    - --stop-writes-on-bgsave-error
    - "no"
  resources:
    requests:
      cpu: 10m
    limits:
      cpu: "500m"
  livenessProbe:
    tcpSocket:
      port: tcp
  readinessProbe:
    tcpSocket:
      port: tcp
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
