image:
  repository: docker.io/ckulka/baikal
  tag: apache-php8.2@sha256:288f8388297d8637265a95052b6375ca534ad4ae9e99fccb73c7c40cf977f424
  pullPolicy: IfNotPresent

subdomain: baikal

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  port: 80
  healthProbe:
    type: tcpSocket
    port: http # Use named port

# Database configuration
database:
  enabled: true

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: data
    mountPath: /var/www/baikal/Specific
    persistentVolumeClaim: data
  - name: config
    mountPath: /var/www/baikal/config
    persistentVolumeClaim: config
  - name: php-config
    mountPath: /usr/local/etc/php/conf.d/zz-security.ini
    subPath: zz-security.ini
    configMap: "{release}-php-config"

# Persistent volume claims
persistentVolumeClaims:
  - name: data
    size: 1Gi
    storageClassName: local-path
    backup: true
  - name: config
    size: 1Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    # Remain private after patching; restoring public access requires a separate decision.
    public: false
    private: true
