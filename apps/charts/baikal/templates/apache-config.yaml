apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-apache-config"
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  apache.conf: |
    <VirtualHost *:80>
        ServerName https://{{ .Values.subdomain }}.{{ .Values.globals.domain }}:443
        DocumentRoot /var/www/baikal/html
        UseCanonicalName On

        # TLS terminates at Istio; never send DAV clients to cleartext HTTP.
        RewriteEngine On
        RewriteRule ^/\.well-known/(caldav|carddav)$ https://{{ .Values.subdomain }}.{{ .Values.globals.domain }}/dav.php [R=302,L]

        <Directory "/var/www/baikal/html">
            Options FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>
    </VirtualHost>
