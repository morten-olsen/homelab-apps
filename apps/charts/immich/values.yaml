subdomain: immich

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# Image configurations for multiple deployments
server:
  image:
    repository: ghcr.io/immich-app/immich-server
    tag: release@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    pullPolicy: IfNotPresent
ml:
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: release@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
    pullPolicy: IfNotPresent
# Valkey holds live queue state. Preserve the existing no-PVC topology and
# default server arguments; a pod replacement can lose queued work.
valkey:
  image:
    repository: valkey/valkey
    tag: 9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    pullPolicy: IfNotPresent
  name: "{release}-valkey"
  commonLabels: false
  selectorLabels:
    app: "{release}-valkey"
  containerName: "{release}-valkey"
  portName: tcp
  port: 6379
  resources:
    requests:
      cpu: 10m
    limits:
      cpu: "500m"
  livenessProbe:
    tcpSocket:
      port: tcp
  readinessProbe:
    tcpSocket:
      port: tcp
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
postgres:
  image:
    repository: pgvector/pgvector
    tag: pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    pullPolicy: IfNotPresent

# Database configuration
database:
  enabled: true

# Persistent volume claims
persistentVolumeClaims:
  - name: upload
    size: 100Gi
    storageClassName: local-path
    backup: true
  - name: library
    size: 100Gi
    storageClassName: local-path
    backup: true
  - name: model-cache
    size: 10Gi
    storageClassName: local-path
    backup: false

# Note: Services are kept custom due to different selectors for each deployment

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: false
    private: true
  servicePort: 80 # Port of the main server service
  # Immich has no CORS support of its own; Envoy answers preflights and adds
  # the headers. API keys travel in x-api-key, so credentials stay disabled.
  corsPolicy:
    allowOrigins:
      - regex: "https?://localhost(:[0-9]+)?"
      - regex: "https://([a-z0-9-]+\\.)+{domain}"
    allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowHeaders:
      - authorization
      - content-type
      - x-api-key
      - x-immich-checksum
      - x-immich-share-key
      - x-immich-user-token
      - x-immich-session-token
    exposeHeaders:
      - content-disposition
      - content-length
    maxAge: 24h

# OIDC client configuration
oidc:
  enabled: true
  redirectUris:
    - "/api/auth/callback/authentik"
  subjectMode: user_username
