subdomain: immich

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# Image configurations for multiple deployments
server:
  image:
    repository: ghcr.io/immich-app/immich-server
    tag: release@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    pullPolicy: IfNotPresent
ml:
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: release@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    pullPolicy: IfNotPresent
# Valkey holds live queue state. Preserve the existing no-PVC topology and
# default server arguments; a pod replacement can lose queued work.
valkey:
  image:
    repository: valkey/valkey
    tag: 9-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    pullPolicy: IfNotPresent
  name: "{release}-valkey"
  commonLabels: false
  selectorLabels:
    app: "{release}-valkey"
  containerName: "{release}-valkey"
  portName: tcp
  port: 6379
  resources:
    requests:
      cpu: 10m
    limits:
      cpu: "500m"
  livenessProbe:
    tcpSocket:
      port: tcp
  readinessProbe:
    tcpSocket:
      port: tcp
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
postgres:
  image:
    repository: pgvector/pgvector
    tag: pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    pullPolicy: IfNotPresent

# Database configuration
database:
  enabled: true

# Persistent volume claims
persistentVolumeClaims:
  - name: upload
    size: 100Gi
    storageClassName: local-path
    backup: true
  - name: library
    size: 100Gi
    storageClassName: local-path
    backup: true
  - name: model-cache
    size: 10Gi
    storageClassName: local-path
    backup: false

# Note: Services are kept custom due to different selectors for each deployment

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true
  servicePort: 80 # Port of the main server service
  # Immich has no CORS support of its own; Envoy answers preflights and adds
  # the headers. API keys travel in x-api-key, so credentials stay disabled.
  corsPolicy:
    allowOrigins:
      - regex: "https?://localhost(:[0-9]+)?"
      - regex: "https://([a-z0-9-]+\\.)+{domain}"
    allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowHeaders:
      - authorization
      - content-type
      - x-api-key
      - x-immich-checksum
      - x-immich-share-key
      - x-immich-user-token
      - x-immich-session-token
    exposeHeaders:
      - content-disposition
      - content-length
    maxAge: 24h

# OIDC client configuration
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - "/api/auth/callback/authentik"
  subjectMode: user_username
