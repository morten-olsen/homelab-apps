# Dragonfly server (android/dragonfly, apps/server): Morten's own ledger, ingesting Lunch Flow
# on its own sync schedule; the Dragonfly app will mirror it. Design: docs/server.md there.
image:
  repository: code.olsen.cloud/android/dragonfly-server
  # Pinned by version and digest; a published android/dragonfly release replaces it
  # (its deploy-release workflow). 0.0.0 marks the first deploy, the main build of 5c6c7b2:
  # the digest is what the node pulls.
  tag: 0.8.0@sha256:43bbd43c61fb4ee4e20ee160cd820f7398699b39c93a7fc95858aea4e65fc660
  pullPolicy: IfNotPresent

# Private gateway only: https://dragonfly.<domain>, LAN and VPN.
subdomain: dragonfly

dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

deployment:
  # One process: the job runner re-queues "running" jobs on start, assuming it is the only one.
  strategy: Recreate
  replicas: 1
  revisionHistoryLimit: 2

container:
  port: 3000
  healthProbe:
    type: httpGet
    path: /api/health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

service:
  port: 3000
  type: ClusterIP

probe:
  path: /api/health

virtualService:
  enabled: true
  gateways:
    public: false
    private: true

# The shared CNPG cluster; the operator provisions dragonfly-connection (url, host, ...).
database:
  enabled: true

# The Authentik client the app and the CLI sign in with (templates/oidc-client.yaml, not
# homelab-common's `oidc`, which can't make a public client). Public: the app is a phone and
# holds no secret, so it signs in with authorization code + PKCE, redirected to
# dragonfly://oauth (dragonfly-dev://oauth for development builds); the CLI uses the device code. Access tokens are RS256 (verified against
# the issuer's JWKS), keyed by the user's uuid. The operator writes the issuer and client id
# to dragonfly-oidc-credentials.
authClient:
  redirectUris:
    - dragonfly://oauth
    - dragonfly-dev://oauth
  subjectMode: user_uuid
  grantTypes:
    - authorization_code
    - refresh_token
    - urn:ietf:params:oauth:grant-type:device_code
  scopes:
    - openid
    - profile
    - email
    - offline_access
  signingKeyName: authentik Self-signed Certificate

# The key that seals provider credentials (Lunch Flow API keys) in the database. Generated
# once, never rotated: losing it means re-entering the keys, not losing data.
externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: secret-key
        length: 32
        encoding: base64
        allowRepeat: true
        secretKeys:
          - secretKey

env:
  # Explicit, because the Service is called dragonfly: Kubernetes injects its service links as
  # DRAGONFLY_PORT=tcp://<ip>:3000 and friends, and a container's own env wins over those.
  DRAGONFLY_PORT: "3000"
  DRAGONFLY_HOST: "0.0.0.0"
  DRAGONFLY_DATABASE_URL:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: url
  DRAGONFLY_SECRET_KEY:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: secretKey
  DRAGONFLY_OIDC_ISSUER:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: issuer
  DRAGONFLY_OIDC_AUDIENCE:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: clientId
  # New connections sync daily at 04:00 local time (after Firefly's 03:30 import); each
  # connection's schedule can be changed through the API.
  DRAGONFLY_TIMEZONE:
    value: "{timezone}"
  DRAGONFLY_SYNC_DEFAULT_SCHEDULE: "0 4 * * *"
