image:
  repository: apache/tika
  tag: 3.3.3.1-full@sha256:36f6f322d5ecf2d0ac12fbdda0fe904625aff73b3363328b35d21bdf9b4c650c
  pullPolicy: IfNotPresent

subdomain: tika

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

deployment:
  strategy: RollingUpdate
  replicas: 1
  revisionHistoryLimit: 0

container:
  port: 9998
  healthProbe:
    type: tcpSocket

service:
  port: 80

# Tika has no authentication; serve it on the private gateway only.
virtualService:
  enabled: true
  gateways:
    public: false
    private: true
