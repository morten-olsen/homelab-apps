image:
  repository: apache/tika
  tag: 3.3.3.0-full@sha256:6ef30abd65df4b6c478907904099d0245bdb0e0686f94fb9bc7493558442bb74
  pullPolicy: IfNotPresent

subdomain: tika

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

deployment:
  strategy: RollingUpdate
  replicas: 1
  revisionHistoryLimit: 0

container:
  port: 9998
  healthProbe:
    type: tcpSocket

service:
  port: 80

virtualService:
  enabled: false
