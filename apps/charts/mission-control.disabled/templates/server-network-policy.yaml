# The server has no sidecar (agents outside the mesh must reach it), so the mesh's ns-isolation policy does not
# guard it. Only the ingress gateway, agent pods and the blackbox probe may connect, on the server's port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "common.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.agents.namespace }} }
        {{- range .Values.networkPolicy.ingressFrom }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .namespace }} }
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.container.port }} }
