# Agent — internal voice/text assistant from the incubator/agent image.
#
# One process tree: a supervisor forks the LiveKit voice worker and the
# Fastify HTTP server. HTTP+frontend listen on :3000 (/api/* and /app/web).
#
# Runtime config (LiveKit URL/keys, LM Studio tiers, STT/TTS, CalDAV,
# Home Assistant) is provided by the pre-existing `agent-secrets` Secret
# in the `prod` namespace — not managed by this chart. To add or change
# env keys, update the Secret and add/remove the matching entry below.
#
# State lives in the shared CNPG cluster, not on disk. The image can fall
# back to embedded PGlite under DATABASE_DIR, but that path can't serve this
# app — the supervisor opens several concurrent connections and PGlite is
# single-connection, which corrupted the on-disk database. Setting
# DATABASE_URL takes precedence over DATABASE_DIR and switches the app to a
# real Postgres pool (one schema per plugin).
#
# No volumes at all. Nothing durable is written to the filesystem: state is in
# Postgres, and speech (STT and TTS) is served by speaches over HTTP. TTS used
# to run in-process from a Hugging Face model on a 40Gi /cache PVC, but under
# this container's 2-core quota synthesis took 7.8s for a 3.2s clip versus
# ~620ms from speaches, so the model — and its volume — are gone.

image:
  repository: code.olsen.cloud/incubator/agent
  tag: latest@sha256:e2f84ee93a37a1b1c831a221c385848fb9cca1304b331c7381983f8d2f1a74ca
  pullPolicy: IfNotPresent

subdomain: agent

deployment:
  strategy: Recreate
  replicas: 1
  revisionHistoryLimit: 0

container:
  port: 3000
  healthProbe:
    type: httpGet
    path: /api/health
    port: 3000
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

service:
  port: 80
  type: ClusterIP

virtualService:
  enabled: true
  gateways:
    public: false
    private: true

# Database — the platform operator provisions a `prod_agent` database and role
# on the shared CNPG cluster and publishes `{release}-connection`.
#
# The app runs `CREATE EXTENSION IF NOT EXISTS vector` at boot so plugins can
# declare pgvector columns. pgvector ships in the cluster's `18-standard` image
# but is not installed per-database, and the provisioned role is not a superuser
# — that used to crash-loop the pod, and is now logged and tolerated. It is
# already installed in `prod_agent` (done by hand, as superuser); only plugins
# that actually declare vector(N) columns need it.
# See tickets/open/2026-08-17-agent-postgres-cutover.md.
database:
  enabled: true

env:
  # Takes precedence over the image's DATABASE_DIR, switching the app off
  # embedded PGlite and onto the shared CNPG cluster.
  DATABASE_URL:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: url

  # All operational config is sourced from the pre-existing agent-secrets
  # Secret. Keep this list in sync with `kubectl get secret agent-secrets`.
  AGENT_NAME:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: AGENT_NAME

  LIVEKIT_URL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: LIVEKIT_URL
  LIVEKIT_API_KEY:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: LIVEKIT_API_KEY
  LIVEKIT_API_SECRET:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: LIVEKIT_API_SECRET

  TIER1_BASE_URL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TIER1_BASE_URL
  TIER1_API_KEY:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TIER1_API_KEY
  TIER1_MODEL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TIER1_MODEL
  TIER2_BASE_URL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TIER2_BASE_URL
  TIER2_API_KEY:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TIER2_API_KEY
  TIER2_MODEL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TIER2_MODEL

  STT_BASE_URL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: STT_BASE_URL
  STT_API_KEY:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: STT_API_KEY
  STT_MODEL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: STT_MODEL
  STT_LANGUAGE:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: STT_LANGUAGE

  TTS_BASE_URL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TTS_BASE_URL
  TTS_API_KEY:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TTS_API_KEY
  TTS_MODEL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TTS_MODEL
  TTS_VOICE:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TTS_VOICE
  TTS_SPEED:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: TTS_SPEED

  CALDAV_GOOGLE_URL:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: CALDAV_GOOGLE_URL
  CALDAV_GOOGLE_USERNAME:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: CALDAV_GOOGLE_USERNAME
  CALDAV_GOOGLE_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: CALDAV_GOOGLE_PASSWORD

  HA_TOKEN:
    valueFrom:
      secretKeyRef:
        name: agent-secrets
        key: HA_TOKEN
