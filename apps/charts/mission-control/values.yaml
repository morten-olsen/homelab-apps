# Mission Control server, in the cluster. Agents are ACP servers it connects to, such as workforce's (ADR 0038 in the
# Mission Control repo); it starts nothing itself. Deployed by the ApplicationSet homelab-apps as Application
# mission-control (enabled 2026-10-07).
image:
  repository: code.olsen.cloud/ai/mission-control
  # Pinned by tag and digest; the registry's tags move.
  tag: 0.64.0@sha256:2badae565085311754033ec3d30e7518ec6a8eaeec294ccca10dbed8cde75568
  pullPolicy: IfNotPresent

# Private gateway only: https://mission-control.<domain>, LAN and VPN. Mission Control has its own login.
subdomain: mission-control

deployment:
  strategy: Recreate # SQLite on one ReadWriteOnce claim: never two writers
  replicas: 1
  revisionHistoryLimit: 2
  # MC_RUN_STOP_GRACE_SECONDS (30) plus 30.
  terminationGracePeriodSeconds: 60
  uid: 10001
  gid: 10001

container:
  port: 7420
  resources:
    requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 1Gi }
    limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 5Gi }
  # Readiness reads SQLite; startup and liveness only check the event loop.
  startupProbe: { path: /api/health, periodSeconds: 5, failureThreshold: 24 }
  readinessProbe: { path: /api/ready, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
  # SQLite blocks the event loop during disk stalls. Allow ~3 minutes before
  # restarting; readiness still stops routing requests after ~30 seconds.
  livenessProbe: { path: /api/health, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 9 }

service:
  port: 7420

probe:
  path: /api/health

persistentVolumeClaims:
  # `store`, not `data`: 0.64.0 started from an empty database (ADR 0038's cut), on a new volume with a backup
  # repository of its own. The old claim mission-control-data is kept on prune (Delete=false) and its volume on
  # deletion (Retain), and its backups stay at <backups>/mission-control-data, until someone removes them.
  - name: store
    size: 30Gi
    # local-path: the only class in the cluster. Not expandable, size not enforced, reclaim Delete.
    storageClassName: local-path
    backup: true

# Settings of the server (docs/reference/configuration.md). The keys are generated in the cluster (templates/keys.yaml).
config:
  maxActiveRuns: 4
  registration: closed
  # Generated once by External Secrets, never rotated by the chart: keys MC_SERVER_SECRET_KEY and MC_SERVER_JWT_SECRET.
  keysSecret: mission-control-keys
  # Optional forge event delivery; disabling retains polling/refresh. Dedicated key, generated once.
  forgeWebhook:
    enabled: true
    secretName: mission-control-forge-webhook

# Who may connect to the server (templates/server-network-policy.yaml).
networkPolicy:
  ingressFrom:
    - namespace: istio-ingress # the gateway serving shared/private
      podLabels: { istio: gateway }
    - namespace: monitoring # the blackbox Probe
      podLabels: { app.kubernetes.io/name: prometheus-blackbox-exporter }
