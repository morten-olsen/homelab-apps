# Private gateway only. Kyverno generates the ServiceEntry and the DNS record from this object.
# Agents speak ACP over long-lived WebSockets: no route timeout and no retries. Istio has no route
# timeout unless one is set, and refuses `0s`, so `timeout` is left out.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "common.fullname" . }}-private
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  gateways:
    {{- include "common.virtualServiceGatewaysPrivate" . | nindent 4 }}
  hosts:
    - {{ include "common.domain" . }}
    - mesh
  http:
    - retries:
        attempts: 0
      route:
        - destination:
            host: {{ include "common.fullname" . }}
            port:
              number: {{ .Values.service.port }}
