image:
  repository: code.olsen.cloud/incubator/editions
  tag: 1b184705@sha256:36445f586d8c6f9fc189e2c5aae5c17cd69e6340c76c0fce0b078872539718b2
  pullPolicy: Always

subdomain: editions

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

deployment:
  strategy: Recreate
  replicas: 1

container:
  # Two ONNX models run in the worker: bge-small embeddings (~500 MB RSS warm)
  # and the bart-large-mnli classifier, 1.6 GB of fp32 weights on its own.
  # At 1536Mi the first classification after the fix was OOMKilled
  # (2026-10-10); the limit leaves room for both models, inference and the
  # SQLite cache. The 72-hour observation settles the final numbers.
  resources:
    requests: { cpu: 250m, memory: 2560Mi }
    limits: { cpu: "2", memory: 4Gi }
  ports:
    - name: http
      port: 3007
      protocol: TCP
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
# Service configuration
service:
  port: 3007
  type: ClusterIP

externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: jwt-secret
        length: 48
        encoding: hex
        allowRepeat: true
        secretKeys:
          - jwt-secret

env:
  # The container's 4Gi limit is what protects the node. The heap ceiling
  # only has to leave room for native (ONNX) memory under it: at 256 MiB the
  # startup re-analysis of ~17k articles hit it and crash-looped (2026-10-10).
  NODE_OPTIONS: "--max-old-space-size=1024"
  EDITIONS_PORT: "3007"
  EDITIONS_JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: jwt-secret

volumes:
  - name: data
    mountPath: /data
    persistentVolumeClaim: data

persistentVolumeClaims:
  - name: data
    size: 10Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true
