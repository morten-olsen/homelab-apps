image:
  repository: code.olsen.cloud/incubator/editions
  tag: latest@sha256:9a618e4f7c879fea95e7af4b49626e3b0c1a2f34e9b74c031d5142a1970d89df
  pullPolicy: Always

subdomain: editions

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

deployment:
  strategy: Recreate
  replicas: 1
  # No Kubernetes API use or mesh policy is needed by Editions.
  podAnnotations:
    sidecar.istio.io/inject: "false"

container:
  # Real fp32 worker warm-up reached ~500 MB RSS. Leave room for native ONNX
  # allocations, both Node heaps and the SQLite/model file cache. The 72-hour
  # post-fix observation must pass before these provisional bounds are final.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 1536Mi }
  ports:
    - name: http
      port: 3007
      protocol: TCP
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
# Service configuration
service:
  port: 3007
  type: ClusterIP

externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: jwt-secret
        length: 48
        encoding: hex
        allowRepeat: true
        secretKeys:
          - jwt-secret

env:
  NODE_OPTIONS: "--max-old-space-size=256"
  EDITIONS_PORT: "3007"
  EDITIONS_JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: jwt-secret

volumes:
  - name: data
    mountPath: /data
    persistentVolumeClaim: data

persistentVolumeClaims:
  - name: data
    size: 10Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true
