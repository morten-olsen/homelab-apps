image:
  repository: code.olsen.cloud/incubator/grundlag
  tag: latest@sha256:ed56d6100e72af2f7cfdb73bba8c905006ebc19d7236b515055b06950ca939fc
  pullPolicy: IfNotPresent

subdomain: grundlag

volumes:
  - name: data
    mountPath: /data
    persistentVolumeClaim: data

persistentVolumeClaims:
  - name: data
    size: 5Gi
    storageClassName: local-path
    backup: true

deployment:
  strategy: Recreate
  replicas: 1
  revisionHistoryLimit: 0

container:
  port: 3800
  healthProbe:
    type: httpGet
    path: /api/health
    port: 3800
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

service:
  port: 80
  type: ClusterIP

virtualService:
  enabled: true
  gateways:
    public: false
    private: true

env:
  HA_URL:
    valueFrom:
      secretKeyRef:
        name: grundlag-secrets
        key: HA_URL
  HA_TOKEN:
    valueFrom:
      secretKeyRef:
        name: grundlag-secrets
        key: HA_TOKEN
