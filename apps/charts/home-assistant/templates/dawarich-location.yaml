apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dawarich-location
data:
  stale-automation.json: |
    {{ .Files.Get "files/stale-automation.yaml" | fromYaml | toJson }}
  location-policy.json: |
    {{ .Values.dawarichLocation | toJson }}
{{ (.Files.Glob "files/dawarich/*.py").AsConfig | indent 2 }}
