image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: 2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
  pullPolicy: IfNotPresent

subdomain: home-assistant

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

# Container configuration
container:
  port: 8123
  healthProbe:
    type: tcpSocket
    port: http # Use named port
  securityContext:
    privileged: true
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      # Prometheus recorded a real 11.66 GiB peak in the last 30 days.
      memory: 24Gi

# Service configuration
service:
  port: 80
  type: ClusterIP

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: false
    private: true

# OIDC client configuration
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - "/auth/openid/callback"
  subjectMode: user_username

# Volume configuration
volumes:
  - name: config
    mountPath: /config
    persistentVolumeClaim: config
  - name: misc
    mountPath: /media/misc
    persistentVolumeClaim: misc # External PVC, not prefixed

# Persistent volume claims
persistentVolumeClaims:
  - name: config
    size: 5Gi
    storageClassName: local-path
    backup: true
piper:
  image:
    repository: ghcr.io/morten-olsen/glados-voice
    tag: main@sha256:8fcc19bd9e7e846bdfd9e9e569c8c944dcfb1d0b47e3f479cbaa7f5587c7206c
