id: dawarich_location_stale_24h
alias: Dawarich tracking needs attention
description: Git-managed; notify once after 24 hours without a fresh recorded Dawarich point.
triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /5
conditions:
  - condition: template
    value_template: >-
      {% set recorded = state_attr('device_tracker.dawarich_morten', 'last_seen') | float(0) %}
      {{ recorded > 0 and as_timestamp(now()) - recorded >= 86400
         and not state_attr('device_tracker.dawarich_morten', 'stale_notification_sent') }}
actions:
  - action: notify.send_message
    target:
      entity_id: notify.home
    data:
      title: Dawarich tracking needs attention
      message: No new location update in 24 hours. Please check Dawarich phone tracking.
  - action: dawarich.acknowledge_stale_location
mode: single
max_exceeded: silent
