image:
  repository: ghcr.io/advplyr/audiobookshelf
  tag: 2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
  pullPolicy: IfNotPresent

subdomain: audiobookshelf

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  port: 80
  healthProbe:
    type: httpGet
    path: /ping

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: config
    mountPath: /config
    persistentVolumeClaim: config # Will be prefixed with release name in template
  - name: metadata
    mountPath: /metadata
    persistentVolumeClaim: metadata # Will be prefixed with release name in template
  - name: audiobooks
    mountPath: /audiobooks
    persistentVolumeClaim: books
  - name: podcasts
    mountPath: /podcasts
    persistentVolumeClaim: podcasts

# Persistent volume claims
persistentVolumeClaims:
  - name: config
    size: 1Gi
    storageClassName: local-path
    backup: true
  - name: metadata
    size: 5Gi
    storageClassName: local-path
    backup: true

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# OIDC/Authentik configuration
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - "/audiobookshelf/auth/openid/callback"
    - "/audiobookshelf/auth/openid/mobile-redirect"

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: false
    private: true
