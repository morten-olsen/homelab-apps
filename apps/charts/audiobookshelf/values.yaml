image:
  repository: ghcr.io/advplyr/audiobookshelf
  tag: 2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
  pullPolicy: IfNotPresent

subdomain: audiobookshelf

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  port: 80
  healthProbe:
    type: httpGet
    path: /ping

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: config
    mountPath: /config
    persistentVolumeClaim: config # Will be prefixed with release name in template
  - name: metadata
    mountPath: /metadata
    persistentVolumeClaim: metadata # Will be prefixed with release name in template
  - name: audiobooks
    mountPath: /audiobooks
    persistentVolumeClaim: books
  - name: podcasts
    mountPath: /podcasts
    persistentVolumeClaim: podcasts

# Persistent volume claims
persistentVolumeClaims:
  - name: config
    size: 1Gi
    storageClassName: local-path
    backup: true
  - name: metadata
    size: 5Gi
    storageClassName: local-path
    backup: true

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# OIDC/Authentik configuration
oidc:
  enabled: true
  redirectUris:
    - "/audiobookshelf/auth/openid/callback"
    - "/audiobookshelf/auth/openid/mobile-redirect"

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: false
    private: true
