{{- /*
  In-cluster NetBird routing peer for the "Home" network (HOMEIT-498). It
  enrolls once with a single-use setup key that puts it in the cluster-routers
  group, which routes Home ahead of the desktop router, and keeps its peer
  identity on a small volume, so the key is worthless after first use. A lost
  volume needs a new key (base scripts/netbird-router.py). It routes for others only:
  client routes (including the 0.0.0.0/0 exit routes sent to All) and DNS stay
  off so the pod's own networking is untouched. Kernel WireGuard needs only
  NET_ADMIN; forwarding is enabled for the pod's network namespace through the
  kubelet's allowed net.ipv4.* sysctls. No Istio sidecar: WireGuard and ICE are
  UDP, and routed traffic leaves through the node, not the mesh.

  Peer-to-peer (HOMEIT-499): WireGuard and ICE share UDP router.wireguardPort.
  The UniFi forward WAN UDP 51820 -> node:51820 reaches the pod through the
  ServiceLB Service below, and NB_EXTERNAL_IP_MAP advertises the WAN address as
  the candidate. The host alias sends the management/relay/STUN hostname to the
  node, where coturn (hostNetwork) answers STUN; through the CoreDNS rewrite it
  would reach the Istio gateway, which has no UDP 3478.
*/ -}}
{{- if .Values.router.enabled }}
{{- $clientHost := printf "%s.%s" .Values.netbird.clientHost .Values.globals.domain }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-router
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: router
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: {{ .Values.netbird.hostIp | quote }}
          hostnames: [{{ $clientHost | quote }}]
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
      containers:
        - name: netbird
          image: "{{ .Values.images.routerImage.repository }}:{{ .Values.images.routerImage.tag }}"
          imagePullPolicy: {{ .Values.images.routerImage.pullPolicy }}
          command: ["/usr/local/bin/netbird-entrypoint.sh"]
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-router-setup-key
                  key: setupKey
                  # Only needed for the first enrollment.
                  optional: true
            - name: NB_MANAGEMENT_URL
              value: "https://{{ $clientHost }}"
            - name: NB_HOSTNAME
              value: {{ .Values.router.hostname | quote }}
            - name: NB_DISABLE_CLIENT_ROUTES
              value: "true"
            - name: NB_DISABLE_DNS
              value: "true"
            - name: NB_LOG_FILE
              value: console
            - name: NB_WIREGUARD_PORT
              value: {{ .Values.router.wireguardPort | quote }}
            - name: NB_EXTERNAL_IP_MAP
              value: {{ .Values.netbird.turn.externalIp | quote }}
            # The entrypoint's `netbird up` only applies these settings while the
            # daemon is disconnected; without this the daemon reconnects from the
            # stored config first and `up` reports "Already connected".
            - name: NB_DISABLE_AUTO_CONNECT
              value: "true"
          volumeMounts:
            - name: state
              mountPath: /var/lib/netbird
          securityContext:
            capabilities:
              add: [NET_ADMIN, NET_RAW]
          readinessProbe:
            exec:
              command: [netbird, status, --check, ready]
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [netbird, status, --check, live]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 256Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-router-state
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-router
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: LoadBalancer
  # Keep the peer's source address so WireGuard and ICE see the real endpoint.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: router
  ports:
    - name: wireguard
      protocol: UDP
      port: {{ .Values.router.wireguardPort }}
      targetPort: {{ .Values.router.wireguardPort }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-router-state
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
{{- end }}
