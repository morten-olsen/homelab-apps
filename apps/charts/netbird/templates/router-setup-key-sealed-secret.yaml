{{- if .Values.router.enabled }}
# Single-use, 24h enrollment key for the router (base scripts/netbird-router.py enroll-key).
# Worthless after first use; the router keeps its identity in netbird-router-state.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: netbird-router-setup-key
  namespace: prod
spec:
  encryptedData:
    setupKey: 
  template:
    metadata:
      name: netbird-router-setup-key
      namespace: prod
    type: Opaque
{{- end }}
