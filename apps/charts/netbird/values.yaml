subdomain: netbird

# Split NetBird into a private admin UI and a public client endpoint.
# - dashboardHost stays on the private gateway for interactive administration.
# - clientHost is safe to put on the public gateway; it exposes only management
#   API/gRPC, signal, and relay paths required by NetBird clients.
netbird:
  hostIp: 192.168.20.180
  dashboardHost: netbird
  clientHost: netbird-client
  management:
    port: 33073
    dnsDomain: netbird.selfhosted
    disableAnonymousMetrics: true
    disableDefaultPolicy: false
    singleAccountModeDomain: olsen.cloud
  signal:
    port: 80
  relay:
    port: 33080
    path: /relay
  turn:
    # Host advertised to clients in the NetBird management config. Keep this
    # resolvable internally now; when WAN forwarding is ready, point public DNS
    # for this name at the WAN IP.
    host: netbird-client.olsen.cloud
    # Coturn's external-ip setting. Must be the WAN IP once off-network clients
    # connect through NAT/port forwarding.
    externalIp: 185.181.220.204
    port: 3478
    minPort: 49152
    maxPort: 49252
    user: self

# Keep each repository/tag object's key ending in Image so Renovate's
# helm-values manager discovers it, including the Coturn and BusyBox helpers.
images:
  dashboardImage:
    repository: netbirdio/dashboard
    tag: v2.95.0@sha256:3d6adfee19dd8d34d795af51daee69d27d2081d2076a5a304cfdd14acc67d6f4
    pullPolicy: IfNotPresent
  managementImage:
    repository: netbirdio/management
    tag: 0.81.5@sha256:1b8c177dce855ef83e4da0fcd82a51a78b80145eb48453fe363fd40aca4b5471
    pullPolicy: IfNotPresent
  signalImage:
    repository: netbirdio/signal
    tag: 0.81.5@sha256:eea5dfeb5ad81216731a7c53b2a2b5b5a35115e66327bbd42c3704fc0b9a857e
    pullPolicy: IfNotPresent
  relayImage:
    repository: netbirdio/relay
    tag: 0.81.5@sha256:9e2b250ed5bfb63c98fb2d184b59847facc200876211ce54bebc86b50499537f
    pullPolicy: IfNotPresent
  coturnImage:
    repository: coturn/coturn
    tag: 4.7.0-r0@sha256:99bf5bf6ab1c119862d0c3d2dfb2bbf805a86a131492cab18c148be64ae7d978
    pullPolicy: IfNotPresent
  routerImage:
    repository: netbirdio/netbird
    tag: 0.81.5@sha256:220974287a42cc2815a77d4fb662edb55a1bf32e6ed73a2ecfc6bde16b5043e1
    pullPolicy: IfNotPresent
  busyboxImage:
    repository: docker.io/library/busybox
    tag: 1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    pullPolicy: IfNotPresent

# Private DNS records for dashboardHost and clientHost point LAN/VPN clients at
# the private Istio gateway. Public DNS for clientHost is expected to be handled
# by the existing Cloudflare/wildcard setup or a manual DNS record.
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

virtualService:
  gateways:
    # Public gateway exposes only client API/gRPC, signal, and relay on
    # netbird-client.{domain}. The dashboard remains private-only.
    public: true
    private: true

# Authentik provisions {release}-oidc-credentials. NetBird's dashboard uses
# /nb-auth and /nb-silent-auth for browser OIDC callbacks; localhost is for
# CLI PKCE enrollment.
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - /nb-auth
    - /nb-silent-auth
    - http://localhost:53000

persistentVolumeClaims:
  - name: management
    size: 5Gi
    storageClassName: local-path
    backup: true
  - name: signal
    size: 1Gi
    storageClassName: local-path
    backup: true

externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: datastore-key
        # NetBird base64-decodes DataStoreEncryptionKey and requires the decoded
        # value to be exactly 32 bytes, so generate 32 random bytes as base64.
        length: 32
        encoding: base64
        secretKeys:
          - datastoreKey
      - name: relay-auth-secret
        length: 32
        encoding: base64
        secretKeys:
          - relayAuthSecret
      - name: turn-password
        length: 32
        encoding: base64
        secretKeys:
          - turnPassword

# In-cluster routing peer for the Home network (templates/router.yaml). Enroll
# with the sealed single-use setup key netbird-router-setup-key (auto-group
# cluster-routers) from base scripts/netbird-router.py.
router:
  enabled: true
  hostname: k8s-router
  # UniFi forwards WAN UDP 51820 to the node (HOMEIT-499); the WAN address is
  # netbird.turn.externalIp.
  wireguardPort: 51820
