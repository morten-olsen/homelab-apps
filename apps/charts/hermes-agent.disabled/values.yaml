# Hermes Agent — Nous Research's self-improving AI agent.
# https://hermes-agent.nousresearch.com/docs/
#
# Deploys two workloads sharing one PVC:
#   * dashboard — web UI at hermes.{domain} (private gateway, port 9119).
#   * gateway   — outbound messaging daemon (Telegram/Discord/Slack/etc.),
#                 no inbound port. Configure interactively post-deploy via:
#                 `kubectl exec -it deploy/hermes-agent-gateway -n prod -- hermes gateway setup`
#
# Built-in password login protects the dashboard in addition to the private gateway.
# See README.md before deploying against retained data.

# Shared image — anchored so dashboard and gateway pin the same digest and
# Renovate updates them together.
image: &image
  repository: nousresearch/hermes-agent
  tag: v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
  pullPolicy: IfNotPresent

dashboard:
  nameOverride: dashboard
  image: *image
  subdomain: hermes

  # DNS is auto-generated by Kyverno from the private-gateway VirtualService.

  deployment:
    strategy: Recreate
    replicas: 1
    revisionHistoryLimit: 0

  # Keep the image entrypoint for s6 bootstrap and privilege dropping.
  # The bundled password provider activates from the env vars below.
  args:
    - dashboard
    - --host
    - 0.0.0.0
    - --no-open
    - --skip-build

  container:
    port: 9119
    healthProbe:
      type: tcpSocket
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 4Gi

  service:
    port: 80
    type: ClusterIP

  volumes:
    - name: data
      mountPath: /opt/data
      persistentVolumeClaim: data

  # Single PVC, mounted by both dashboard and gateway. Resolves to
  # `hermes-agent-data` (Release-name prefix). Single-node K3s, so the RWO
  # access mode is fine — both pods schedule on the same node.
  persistentVolumeClaims:
    - name: data
      size: 20Gi
      storageClassName: local-path
      backup: true

  virtualService:
    enabled: true
    gateways:
      public: false
      private: true

  # Generated once in-cluster; keep both login and session signing stable on restart.
  externalSecrets:
    - name: "{fullname}-login"
      passwords:
        - name: credentials
          length: 32
          encoding: hex
          allowRepeat: true
          secretKeys:
            - password
            - session-secret

  env:
    HERMES_UID: "10000"
    HERMES_GID: "10000"
    HERMES_DASHBOARD_PUBLIC_URL: "https://{subdomain}.{domain}"
    HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
    HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: "{fullname}-login"
          key: password
    HERMES_DASHBOARD_BASIC_AUTH_SECRET:
      valueFrom:
        secretKeyRef:
          name: "{fullname}-login"
          key: session-secret

gateway:
  nameOverride: gateway
  image: *image
  # Unused (no VirtualService) but kept to keep env-var placeholder substitution happy.
  subdomain: hermes-gateway

  deployment:
    strategy: Recreate
    replicas: 1
    revisionHistoryLimit: 0

  args:
    - gateway
    - run

  container:
    # Gateway is outbound-only — connects to messaging providers' APIs over
    # the internet, nothing listens. Set a port to satisfy the template; use
    # an exec probe since a TCP probe would fail.
    port: 1
    healthProbe:
      type: exec
      command:
        - /bin/sh
        - -c
        - pgrep -f hermes >/dev/null
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi

  # No service / virtualService / dns — gateway is outbound-only.

  volumes:
    - name: data
      mountPath: /opt/data
      persistentVolumeClaim: data

  env:
    HERMES_UID: "10000"
    HERMES_GID: "10000"
