# Hindsight: long-term memory for agents (retain / recall / reflect), served as a
# REST API and an MCP server, plus a web control plane.
#
# Two deployments in one chart, so the two auth models never overlap:
#
#   ui  → hindsight.{domain}      Control plane (Next.js). Self-hosted Hindsight has
#                                 no OIDC, only a shared access key, so the UI sits
#                                 behind Authentik forward auth instead. The policy
#                                 selects only this pod.
#   api → hindsight-api.{domain}  REST API (/v1/…) and MCP (/mcp/…). No forward auth;
#                                 every request needs `Authorization: Bearer <apiKey>`
#                                 from {release}-secrets (built-in ApiKeyTenantExtension,
#                                 which also guards MCP).
#
# The UI reaches the API over cluster DNS with the same key; browsers never see it.
#
# Database: shared CNPG (prod_hindsight). Migrations create pg_trgm and btree_gin
# themselves (trusted), but vector is not trusted, so it is created once as
# superuser (like immich and mcphub):
#   kubectl exec -n shared postgres-cluster-1 -c postgres -- \
#     psql -U postgres -d prod_hindsight -c 'CREATE EXTENSION IF NOT EXISTS vector;'
#
# Models: the LLM is GLM-5.3-Flash through 9router, failing over to llama-swap's
# `long` alias (env below). Embeddings
# (BAAI/bge-small-en-v1.5, 384 dims) and the reranker (hindsight-ai/hs-rerank-1) run
# on CPU inside the full API image, which ships them preloaded, so no cache volume is
# needed. llama-swap's embedding model is not used: it swaps models one at a time,
# and qwen3-embedding-8b's 4096 dims exceed pgvector's 2000-dim HNSW limit.
# Changing the embedding model later means re-indexing every bank.

api:
  # Resources are named {release}-dataplane, not {release}-api: Kubernetes injects
  # service links into every pod, and a Service named hindsight-api would set
  # HINDSIGHT_API_PORT=tcp://… — Hindsight's own config prefix — and crash it.
  nameOverride: dataplane

  image:
    repository: ghcr.io/vectorize-io/hindsight-api
    tag: 1.2.1@sha256:662109ece429871a81e036427fb93fbb09ba9dc4b01d320d356f114c0e1aedd8
    pullPolicy: IfNotPresent

  subdomain: hindsight-api

  # Migrations run on startup and the in-process worker claims tasks under a fixed
  # worker ID, so never run an old and a new pod side by side.
  deployment:
    strategy: Recreate
    replicas: 1
    revisionHistoryLimit: 0

  container:
    port: 8888
    healthProbe:
      type: httpGet
      # /health checks the database; liveness must not, so a slow database
      # never restarts the pod.
      path: /health/live
      port: http
      # First start runs the migrations and loads the local models
      # (HINDSIGHT_API_MODEL_INIT_TIMEOUT defaults to 300s).
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 20
    # Explicit requests: a limit alone becomes the request. Upstream sizes the
    # full image at 1.5-2 GB with the embedder and reranker loaded.
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        memory: 4Gi

  service:
    port: 80

  probe:
    path: /health

  virtualService:
    enabled: true
    gateways:
      public: false
      private: true

  database:
    enabled: true

  externalSecrets:
    - name: "{release}-secrets"
      passwords:
        - name: api-key
          length: 64
          encoding: hex
          allowRepeat: true
          secretKeys:
            - apiKey

  env:
    HINDSIGHT_API_DATABASE_URL:
      valueFrom:
        secretKeyRef:
          name: "{release}-connection"
          key: url
    HINDSIGHT_API_TENANT_EXTENSION: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
    HINDSIGHT_API_TENANT_API_KEY:
      valueFrom:
        secretKeyRef:
          name: "{release}-secrets"
          key: apiKey
    # Stable identity so tasks claimed before a restart are picked up again.
    HINDSIGHT_API_WORKER_ID: "{release}"
    # Primary: GLM-5.3-Flash on OpenCode Go through 9router (zero data retention).
    # Local Gemma took 20-40s per call; see HOMEIT-530.
    HINDSIGHT_API_LLM_PROVIDER: openai
    HINDSIGHT_API_LLM_BASE_URL: "http://ninerouter.{namespace}.svc.cluster.local/v1"
    HINDSIGHT_API_LLM_MODEL: ocg/glm-5.3-flash
    # Dedicated 9router API key, sealed in templates/ninerouter-key-sealed-secret.yaml.
    HINDSIGHT_API_LLM_API_KEY:
      valueFrom:
        secretKeyRef:
          name: hindsight-ninerouter
          key: apiKey
    # 9router has the "caveman" token saver on globally, which injects a terse-style
    # system prompt into every request; this header opts Hindsight out.
    HINDSIGHT_API_LLM_DEFAULT_HEADERS: '{"x-9router-token-saver":"off"}'
    # The OpenAI client omits `stream` on plain calls, and 9router then answers
    # with an event stream that the client cannot parse as JSON.
    HINDSIGHT_API_LLM_EXTRA_BODY: '{"stream":false}'
    HINDSIGHT_API_LLM_MAX_CONCURRENT: "2"
    # Short enough that a stalled upstream fails over to the local model.
    HINDSIGHT_API_LLM_TIMEOUT: "120"
    HINDSIGHT_API_LLM_STRATEGY: '{"mode":"failover"}'
    # Failover: llama-swap's `long` alias, the same gemma-4-26b-a4b weights as
    # `primary` with a 32k context instead of 16k. llama-swap serves one model at a
    # time and loads it on demand (about 4s from cold), so it can swap out `primary`.
    HINDSIGHT_API_LLM_1_PROVIDER: openai
    HINDSIGHT_API_LLM_1_BASE_URL: "http://llama-swap.{namespace}.svc.cluster.local:8090/v1"
    HINDSIGHT_API_LLM_1_MODEL: long
    # llama-swap takes no key, but the OpenAI client refuses to start without one.
    HINDSIGHT_API_LLM_1_API_KEY: llama-swap
    HINDSIGHT_API_LLM_1_TIMEOUT: "300"
    # Gemma 4 thinks by default, and at Hindsight's temperature 0.1 its reasoning
    # loops until the output limit: retain spent 16k tokens (about 200s) on a
    # two-sentence input and returned nothing. Without thinking, the same
    # extraction takes 384 tokens.
    HINDSIGHT_API_LLM_1_EXTRA_BODY: '{"chat_template_kwargs":{"enable_thinking":false}}'
    # Fit the failover's 32k context. The defaults assume hosted models: retain asks
    # for up to 64k output tokens, and reflect gathers up to 100k tokens of evidence.
    # Retain's cap must stay above HINDSIGHT_API_RETAIN_CHUNK_SIZE (3000).
    HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: "16000"
    HINDSIGHT_API_REFLECT_MAX_CONTEXT_TOKENS: "20000"

ui:
  image:
    repository: ghcr.io/vectorize-io/hindsight-control-plane
    tag: 1.2.1@sha256:74a113e1f02ace9e8feed954e6b42282e9e3d33b7e0b6d528158d05902552a9a
    pullPolicy: IfNotPresent

  subdomain: hindsight

  deployment:
    strategy: RollingUpdate
    replicas: 1
    revisionHistoryLimit: 0

  container:
    port: 3000
    healthProbe:
      type: tcpSocket
      port: http
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 1Gi

  service:
    port: 80

  # Excluded from forward auth. Reports UI and API reachability only.
  probe:
    path: /api/health

  virtualService:
    enabled: true
    gateways:
      public: false
      private: true

  forwardAuth:
    enabled: true
    excludePaths:
      - /api/health
    allowedGroups:
      - name: admin
        namespace: shared
    group:
      members: []

  env:
    NODE_ENV: production
    HINDSIGHT_CP_HOSTNAME: "0.0.0.0"
    HINDSIGHT_CP_PORT: "3000"
    HINDSIGHT_CP_DATAPLANE_API_URL: "http://{release}-dataplane.{namespace}.svc.cluster.local"
    HINDSIGHT_CP_DATAPLANE_API_KEY:
      valueFrom:
        secretKeyRef:
          name: "{release}-secrets"
          key: apiKey
