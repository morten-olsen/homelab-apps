# Hindsight's own 9router API key (9router dashboard, key "hindsight"), the LLM key in
# values.yaml. Revoke it in 9router to cut Hindsight off without touching other clients.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hindsight-ninerouter
  namespace: prod
spec:
  encryptedData:
    apiKey:   # gitleaks:allow (sealed ciphertext)
  template:
    metadata:
      name: hindsight-ninerouter
      namespace: prod
