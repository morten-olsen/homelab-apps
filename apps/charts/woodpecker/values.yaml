image:
  repository: docker.io/woodpeckerci/woodpecker-server
  tag: v3.19.0@sha256:6ca167a3c58b50c5a3c903dd8db92b39cfc30c560a47052cff7dd0235123a9cb
  pullPolicy: IfNotPresent

agent:
  image:
    repository: docker.io/woodpeckerci/woodpecker-agent
    tag: v3.19.0@sha256:f85f163e09494ace3377a3f3a6043f131fb47e3e627f7438de42417ee06ca56d
    pullPolicy: IfNotPresent
  replicas: 1
  # Concurrent workflows this agent will run in parallel. Each workflow's
  # steps write to a volume on the node's NVMe, beside the k3s datastore and
  # every app's data, and resource limits do not bound disk I/O: on
  # 2026-10-10 four workflows at once (pnpm installs) pushed I/O pressure to
  # ~40% and stalled Mission Control, the ingress gateway and Grafana. Two
  # until CI gets disk of its own (Mission Control task in Home IT).
  maxWorkflows: 2
  # Namespace where the k8s backend creates ephemeral pipeline pods. Kept
  # out of prod so a LimitRange can bound every step without touching apps.
  pipelineNamespace: woodpecker-ci
  # Defaults for steps that set no resources of their own. Unbounded steps
  # reached ~4 cores each and drove node load past 500 during CI bursts.
  # Memory leaves headroom over observed peaks (mise ~5 GiB, kaniko ~3.7 GiB).
  pipelineLimits:
    default:
      cpu: "2"
      memory: 6Gi
    defaultRequest:
      cpu: 100m
      memory: 256Mi
  pipelineStorageClass: local-path
  pipelineVolumeSize: 10G

subdomain: woodpecker

deployment:
  strategy: Recreate
  replicas: 1
  revisionHistoryLimit: 2

container:
  ports:
    - name: http
      port: 8000
      protocol: TCP
    - name: grpc
      port: 9000
      protocol: TCP
  healthProbe:
    type: httpGet
    path: /healthz
    port: http

dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

database:
  enabled: true

service:
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
      type: ClusterIP
    - name: grpc
      port: 9000
      targetPort: 9000
      protocol: TCP
      serviceName: grpc
      type: ClusterIP

volumes:
  - name: data
    mountPath: /var/lib/woodpecker
    persistentVolumeClaim: data

persistentVolumeClaims:
  - name: data
    size: 5Gi
    storageClassName: local-path
    backup: true

virtualService:
  enabled: true
  gateways:
    public: false
    private: true
  servicePort: 80

externalSecrets:
  - name: "{release}-agent-secret"
    passwords:
      - name: agent-secret
        length: 64
        allowRepeat: true
        encoding: hex
        secretKeys:
          - agent-secret

env:
  WOODPECKER_HOST:
    value: "https://{subdomain}.{domain}"
  WOODPECKER_OPEN: "false"
  WOODPECKER_ADMIN: morten-olsen
  WOODPECKER_LOG_LEVEL: info
  # Forgejo forge integration
  WOODPECKER_FORGEJO: "true"
  WOODPECKER_FORGEJO_URL:
    value: "https://code.{domain}"
  WOODPECKER_FORGEJO_CLIENT:
    valueFrom:
      secretKeyRef:
        name: woodpecker-forgejo-oauth
        key: client-id
  WOODPECKER_FORGEJO_SECRET:
    valueFrom:
      secretKeyRef:
        name: woodpecker-forgejo-oauth
        key: client-secret
  # Shared secret authenticating agents
  WOODPECKER_AGENT_SECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-agent-secret"
        key: agent-secret
  # Database (postgres) — single connection-string env
  WOODPECKER_DATABASE_DRIVER: postgres
  WOODPECKER_DATABASE_DATASOURCE:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: url
