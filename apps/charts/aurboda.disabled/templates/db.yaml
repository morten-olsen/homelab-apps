{{- /*
PostGIS for Aurboda alone. Aurboda creates a database per user and enables
PostGIS in each, so its role is the instance's superuser; that is why it does
not use the shared CNPG cluster. Same layout as dawarich-db.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-db"
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-db"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-db"
    spec:
      # postgres uid in the postgis/postgis:alpine image
      securityContext:
        fsGroup: 70
      containers:
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: "{{ .Values.db.image.pullPolicy }}"
          args: ["-c", "max_connections={{ .Values.db.maxConnections }}"]
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "{{ .Values.db.user }}"
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-secrets"
                  key: dbPassword
            # A subdirectory, so initdb does not trip over lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "postgres"]
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-db-data"
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-db"
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app: "{{ .Release.Name }}-db"
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: "{{ .Release.Name }}-db"
