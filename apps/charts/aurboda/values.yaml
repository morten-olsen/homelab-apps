# Aurboda: self-hosted quantified-self aggregator (https://github.com/fiddur/aurboda).
# One image runs nginx (port 80) in front of the Node backend; data lives in
# PostgreSQL with PostGIS, one database per user plus a central one.

subdomain: aurboda

# Personal health data: reachable from the home network only, like the
# earlier health app. Public exposure (phone push away from home, Oura/Strava
# webhooks, federation) is a separate decision.
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

image:
  repository: docker.io/fiddur/aurboda
  # Tags are a release counter (v1.0.<n>); schema changes are expand-only.
  tag: v1.0.3750@sha256:7f67e21f75a101f35616cf8b824c1f0b0280503f93d0a4aee0c520d7875de92d
  pullPolicy: IfNotPresent

deployment:
  strategy: Recreate
  replicas: 1
  revisionHistoryLimit: 0

container:
  port: 80
  # Goes through nginx to the backend, which listens only after startup and
  # migrations, and reads the central DB.
  healthProbe:
    type: httpGet
    path: /api/status
    port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 2Gi

service:
  port: 80
  type: ClusterIP

probe:
  path: /api/status

virtualService:
  enabled: true
  gateways:
    public: false
    private: true

# Authentik client for Aurboda's SSO. The operator writes clientId,
# clientSecret and issuer to {release}-oidc-credentials; an admin adds them
# under Admin settings -> SSO providers (Aurboda keeps providers in its DB, not
# env). The Android app signs in through it via net.aurboda.oidc://, which
# needs no public assetlinks.json.
oidc:
  enabled: true
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  redirectUris:
    - "/api/auth/oidc/callback"
  subjectMode: user_username

env:
  PGHOST:
    value: "{release}-db"
  PGPORT: "5432"
  PGUSER: aurboda_service
  PGPASSWORD:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: dbPassword
  SESSION_SECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-session"
        key: sessionSecret
  WEB_HOST:
    value: "https://{subdomain}.{domain}"
  API_BASE_URL:
    value: "https://{subdomain}.{domain}/api"
  NODE_ENV: production
  # Published in /.well-known/assetlinks.json so the Android app (net.aurboda)
  # may use this site's passkeys. The signing certificate of the official APK
  # on GitHub releases (read from v1.0.3750; aurboda.net lists the same key).
  # Play Store builds are re-signed by Google and would need their key added.
  ANDROID_APP_FINGERPRINTS: "80:EA:56:64:44:9D:8D:28:BC:8E:D0:EC:ED:AA:6A:4D:91:BD:B9:82:E2:AA:68:5C:4E:4C:D2:F9:8A:10:49:56"
  # ALLOW_SIGNUP is left unset on purpose: the first account becomes admin,
  # then signup is closed in Admin settings (the env var would be migrated
  # into the DB and is deprecated upstream).

# Generated once (refreshInterval 0).
externalSecrets:
  - name: "{release}-session"
    passwords:
      # Aurboda requires exactly 32 bytes; raw is one byte per character (hex
      # would double it).
      - name: session-secret
        length: 32
        encoding: raw
        allowRepeat: true
        secretKeys:
          - sessionSecret
  # Unchanged since the first rollout: changing this spec makes ESO regenerate
  # both keys, and a new dbPassword would no longer match the database. Its
  # sessionSecret (64 hex characters) is unused.
  - name: "{release}-secrets"
    passwords:
      - name: session-secret
        length: 32
        encoding: hex
        allowRepeat: true
        secretKeys:
          - sessionSecret
      - name: db-password
        length: 32
        encoding: hex
        allowRepeat: true
        secretKeys:
          - dbPassword

persistentVolumeClaims:
  - name: db-data
    size: 10Gi
    storageClassName: local-path
    backup: true

db:
  image:
    repository: docker.io/postgis/postgis
    # Keep the major at 16: the app image ships postgresql16-client for data
    # export, and pg_dump refuses a newer server.
    tag: 16-3.5-alpine@sha256:47e961a569fd52ff31f0fe205ed91eeab17d9f5fff6722e6d7ea6b588748b293
    pullPolicy: IfNotPresent
  user: aurboda_service
  # Upstream's compose value: each user database gets its own pool.
  maxConnections: 200
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
