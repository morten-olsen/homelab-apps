image:
  repository: vikunja/vikunja
  tag: latest@sha256:22df4c1bc8843c28d383bc5f52b59e7b601bf5f6560b36b29c0a500833c77fa3
  pullPolicy: IfNotPresent

subdomain: vikunja

# DNS configuration
dns:
  enabled: true
  type: A
  dnsClassRef:
    name: private-dns

# Deployment configuration
deployment:
  strategy: RollingUpdate
  replicas: 1

# Container configuration
container:
  port: 3456
  healthProbe:
    type: tcpSocket
    port: http # Use named port

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: data
    mountPath: /app/vikunja/files
    persistentVolumeClaim: data

# Persistent volume claims
persistentVolumeClaims:
  - name: data
    size: 1Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration
virtualService:
  enabled: true
  gateways:
    public: true
    private: true

# OIDC client configuration
oidc:
  enabled: true
  redirectUris:
    - "/auth/openid/oidc"
  subjectMode: user_username

# Database configuration
database:
  enabled: true

# External Secrets configuration
externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: encryptionkey
        length: 64
        allowRepeat: true
        encoding: hex
        secretKeys:
          - encryptionkey

# Environment variables
env:
  VIKUNJA_SERVICE_TIMEZONE:
    value: "{timezone}"
  VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
  VIKUNJA_AUTH_OPENID_ENABLED: "true"
  VIKUNJA_AUTH_OPENID_PROVIDERS_OIDC_NAME: Authentik
  VIKUNJA_AUTH_OPENID_PROVIDERS_OIDC_AUTHURL:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: issuer
  VIKUNJA_AUTH_OPENID_PROVIDERS_OIDC_USERNAMEFALLBACK: "true"
  VIKUNJA_AUTH_OPENID_PROVIDERS_OIDC_EMAILFALLBACK: "true"
  VIKUNJA_AUTH_OPENID_PROVIDERS_OIDC_CLIENTID:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: clientId
  VIKUNJA_AUTH_OPENID_PROVIDERS_OIDC_CLIENTSECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-oidc-credentials"
        key: clientSecret
  VIKUNJA_SERVICE_PUBLICURL:
    value: "https://{subdomain}.{domain}"
  VIKUNJA_SERVICE_JWTSECRET:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: encryptionkey
  VIKUNJA_DATABASE_TYPE: postgres
  VIKUNJA_DATABASE_DATABASE:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: database
  VIKUNJA_DATABASE_HOST:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: host
  VIKUNJA_DATABASE_USER:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: user
  VIKUNJA_DATABASE_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: "{release}-connection"
        key: password
