image:
  repository: docker.io/decolua/9router
  tag: 0.5.75@sha256:7c893bc2c27ecea2ae337abd5eacfec9e5763091b3a3b7862fc0625b770bb156
  pullPolicy: IfNotPresent

subdomain: 9router

# Service names must be DNS-1035 labels (cannot start with a digit),
# so k8s resources are named "ninerouter" while the app/URL stays 9router
fullnameOverride: ninerouter

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  ports:
    - name: http
      port: 20128
      protocol: TCP
  healthProbe:
    type: httpGet
    path: /api/health
    port: 20128

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: data
    mountPath: /app/data
    persistentVolumeClaim: data

# Persistent volume claims
persistentVolumeClaims:
  - name: data
    size: 1Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration — holds provider API keys, private only
virtualService:
  enabled: true
  gateways:
    public: false
    private: true

# Generated secrets
externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: initial-password
        length: 32
        encoding: hex
        allowRepeat: true
        secretKeys:
          - initial-password

# Environment variables
env:
  INITIAL_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: initial-password
