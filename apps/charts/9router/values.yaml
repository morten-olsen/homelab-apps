image:
  repository: docker.io/decolua/9router
  tag: 0.5.116@sha256:12086f97857f784ab7762e95595f70d71279a7a60c800af0f100183e8da7ea36
  pullPolicy: IfNotPresent

subdomain: 9router

# Service names must be DNS-1035 labels (cannot start with a digit),
# so k8s resources are named "ninerouter" while the app/URL stays 9router
fullnameOverride: ninerouter

# Deployment configuration
deployment:
  strategy: Recreate
  replicas: 1

# Container configuration
container:
  ports:
    - name: http
      port: 20128
      protocol: TCP
  healthProbe:
    type: httpGet
    path: /api/health
    port: 20128

# Service configuration
service:
  port: 80
  type: ClusterIP

# Volume configuration
volumes:
  - name: data
    mountPath: /app/data
    persistentVolumeClaim: data

# Persistent volume claims
persistentVolumeClaims:
  - name: data
    size: 1Gi
    storageClassName: local-path
    backup: true

# VirtualService configuration — holds provider API keys, private only
virtualService:
  enabled: true
  gateways:
    public: false
    private: true

# OIDC client for the dashboard login. 9router stores the issuer, client ID and
# secret in its own settings (Profile page), so they are entered there from
# ninerouter-oidc-credentials (named after fullnameOverride). 9router admits any
# user the provider authenticates, so the Authentik group binding is the only
# access control.
oidc:
  # Additional application access; the chart always retains its own group.
  allowedGroups:
    - name: admin
      namespace: shared
  group:
    members: []
  enabled: true
  redirectUris:
    - "/api/auth/oidc/callback"
  # 9router verifies the ID token only against the JWKS, which stays empty (HS256)
  # unless the provider has a signing key.
  signingKeyName: authentik Self-signed Certificate

# Generated secrets
externalSecrets:
  - name: "{release}-secrets"
    passwords:
      - name: initial-password
        length: 32
        encoding: hex
        allowRepeat: true
        secretKeys:
          - initial-password

# Environment variables
env:
  INITIAL_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: "{release}-secrets"
        key: initial-password
  # Origin for the OIDC redirect URI, instead of trusting forwarded headers.
  BASE_URL: "https://{subdomain}.{domain}"
